[project]
name = "gld-kiln"
version = "0.1.0"
description = "Positional little-endian Kiln codec for Python"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Leonid Ganeline"}]

[project.scripts]
gld-kilngen-python = "kiln.codegen:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
